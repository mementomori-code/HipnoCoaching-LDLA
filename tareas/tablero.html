<title>Tareas Setters LDLA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: una sola columna angosta, texto y líneas finas; sin tarjetas ni color salvo un punto para prioridad alta. */
:root {
  --bg: #ffffff;
  --ink: #111111;
  --muted: #8a8a8a;
  --line: #ececec;
  --hi: #d23c2a;
  --font: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e0e0e; --ink: #ededed; --muted: #7a7a7a; --line: #222222; --hi: #ff6a55; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e0e0e; --ink: #ededed; --muted: #7a7a7a; --line: #222222; --hi: #ff6a55; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 20px; padding-block: 56px 96px; display: grid; gap: 40px; }
h1 { font-size: 1.15rem; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.top { display: grid; gap: 14px; }
.summary { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-weight: 500; }
.bar { height: 1px; background: var(--line); }
.bar i { display: block; height: 1px; background: var(--ink); width: 0; transition: width .4s; }

.filters { display: grid; gap: 8px; font-size: 0.875rem; }
.filters .row { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.filters button { color: var(--muted); }
.filters button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.filters button:hover { color: var(--ink); }

.day { display: grid; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.day-head h2 { font-size: 0.95rem; font-weight: 500; margin: 0; text-wrap: balance; }
.date { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 2px; }
.day-meta { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.day-note { color: var(--muted); font-size: 0.85rem; margin: 10px 0 0; }
.sources { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; margin-top: 6px; }
.sources a { color: var(--muted); text-underline-offset: 3px; }
.sources a:hover { color: var(--ink); }

.task { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 14px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.check { appearance: none; width: 16px; height: 16px; margin: 3px 0 0; border: 1px solid var(--muted); border-radius: 50%; cursor: pointer; display: grid; place-content: center; }
.check:checked { background: var(--ink); border-color: var(--ink); }
.check:checked::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
.check:disabled { cursor: default; }
.t-body { min-width: 0; display: grid; gap: 4px; }
.t-title { cursor: pointer; }
.t-title .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--hi); margin-left: 8px; vertical-align: middle; }
.t-detail { color: var(--muted); font-size: 0.85rem; margin: 0; }
.meta { color: var(--muted); font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 0 14px; }
.meta button:hover { color: var(--ink); }
.task.done .t-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.task.done .t-detail { display: none; }
.note { width: 100%; margin-top: 6px; min-height: 60px; font: inherit; font-size: 0.85rem; padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); resize: vertical; }
.note:focus { outline: none; border-bottom-color: var(--ink); }
.note-text { font-size: 0.85rem; margin: 2px 0 0; white-space: pre-wrap; }

.add > button { color: var(--muted); font-size: 0.875rem; }
.add > button:hover { color: var(--ink); }
.add form { display: grid; gap: 14px; margin-top: 18px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.add label { display: grid; gap: 2px; font-size: 0.75rem; color: var(--muted); }
.add .wide { grid-column: 1 / -1; }
.add input, .add select, .add textarea { font: inherit; font-size: 0.9rem; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); width: 100%; border-radius: 0; }
.add input:focus, .add select:focus, .add textarea:focus { outline: none; border-bottom-color: var(--ink); }
.add .submit { justify-self: start; font-size: 0.875rem; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }

.empty, .status { color: var(--muted); font-size: 0.875rem; margin: 0; }
.status.err { color: var(--hi); }
@media (max-width: 520px) { .add form { grid-template-columns: 1fr 1fr; } .wrap { padding-block: 36px 72px; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Tareas · Setting LDLA</h1>
    <p class="summary" id="summary">&nbsp;</p>
    <div class="bar"><i id="s-bar"></i></div>
  </header>

  <nav class="filters" aria-label="Filtros">
    <div class="row" id="f-setter" role="group" aria-label="Setter"></div>
    <div class="row" id="f-estado" role="group" aria-label="Estado"></div>
  </nav>

  <p class="status" id="status">Cargando…</p>
  <main id="list" style="display:grid;gap:48px"></main>

  <section class="add" id="add-box">
    <button type="button" id="add-toggle" aria-expanded="false">+ Agregar tarea</button>
    <form id="add-form" hidden>
      <label>Día<input type="date" id="a-fecha" required></label>
      <label>Setter<select id="a-setter"></select></label>
      <label>Prioridad<select id="a-prio"><option value="alta">Alta</option><option value="media" selected>Media</option><option value="baja">Baja</option></select></label>
      <label>Plazo<select id="a-plazo"><option>Esta semana</option><option>Este mes</option><option>Este trimestre</option><option>Próximo 1:1</option></select></label>
      <label class="wide">Tarea<input id="a-titulo" required maxlength="200"></label>
      <label class="wide">Detalle<textarea id="a-detalle" rows="1" maxlength="1000"></textarea></label>
      <button class="submit" type="submit">Agregar</button>
    </form>
  </section>
</div>

<script>
const SETTERS = ["Equipo", "Yaris", "Kelly", "Rosario", "Brenda", "Tobías"];
const PRIO = { alta: 0, media: 1, baja: 2 };
const ESTADOS = [["pend", "Pendientes"], ["todas", "Todas"], ["hechas", "Hechas"]];
const state = { tareas: [], dias: {}, setter: "Todos", estado: "pend", editing: null };
try { state.estado = localStorage.getItem("ldla-estado") || "pend"; state.setter = localStorage.getItem("ldla-setter") || "Todos"; } catch (e) {}
let db = null, canWrite = true;

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const fmtFecha = (iso) => {
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
};
const hoy = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

function renderFilters() {
  const fs = $("f-setter"); fs.replaceChildren();
  ["Todos", ...SETTERS].forEach(id => {
    const open = state.tareas.filter(t => !t.done && (id === "Todos" || t.setter === id)).length;
    const b = el("button", null, id + (open ? " " + open : "")); b.type = "button";
    b.setAttribute("aria-pressed", state.setter === id);
    b.onclick = () => { state.setter = id; try { localStorage.setItem("ldla-setter", id); } catch (e) {} render(); };
    fs.append(b);
  });
  const fe = $("f-estado"); fe.replaceChildren();
  ESTADOS.forEach(([id, label]) => {
    const b = el("button", null, label); b.type = "button";
    b.setAttribute("aria-pressed", state.estado === id);
    b.onclick = () => { state.estado = id; try { localStorage.setItem("ldla-estado", id); } catch (e) {} render(); };
    fe.append(b);
  });
}

function renderSummary() {
  const all = state.tareas, done = all.filter(t => t.done).length;
  const alta = all.filter(t => !t.done && t.prioridad === "alta").length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;
  const s = $("summary"); s.replaceChildren();
  if (!all.length) { s.innerHTML = "&nbsp;"; return; }
  s.append(el("b", null, String(all.length - done)), " pendientes · ", el("b", null, String(alta)), " de prioridad alta · ", el("b", null, pct + "%"), " hecho");
  $("s-bar").style.width = pct + "%";
}

async function save(id, data) {
  try { await db.collection("tareas").doc(id).update(data); return true; }
  catch (e) { showError(e); return false; }
}

function taskRow(t) {
  const row = el("article", "task" + (t.done ? " done" : ""));
  const cb = el("input", "check"); cb.type = "checkbox"; cb.checked = !!t.done; cb.id = "c-" + t.id;
  cb.disabled = !canWrite;
  cb.onchange = async () => { if (!(await save(t.id, { done: cb.checked, doneAt: cb.checked ? new Date().toISOString() : null }))) cb.checked = !cb.checked; };
  const body = el("div", "t-body");
  const title = el("label", "t-title", t.titulo); title.htmlFor = cb.id;
  if (t.prioridad === "alta" && !t.done) { const d = el("span", "dot"); d.title = "Prioridad alta"; d.setAttribute("aria-label", "prioridad alta"); title.append(d); }
  body.append(title);
  if (t.detalle) body.append(el("p", "t-detail", t.detalle));

  const meta = el("div", "meta");
  meta.append(el("span", null, t.setter));
  if (t.plazo) meta.append(el("span", null, t.plazo));
  if (t.done && t.doneAt) meta.append(el("span", null, "hecha " + new Date(t.doneAt).toLocaleDateString("es-AR", { day: "numeric", month: "short" })));
  if (canWrite) {
    const nb = el("button", null, t.nota ? "editar nota" : "nota"); nb.type = "button";
    nb.onclick = () => { state.editing = state.editing === t.id ? null : t.id; render(); const n = $("n-" + t.id); if (n) n.focus(); };
    meta.append(nb);
  }
  body.append(meta);

  if (state.editing === t.id) {
    const ta = el("textarea", "note"); ta.id = "n-" + t.id; ta.value = t.nota || ""; ta.placeholder = "Qué se hizo, qué respondió, qué falta";
    ta.onblur = async () => { if (ta.value !== (t.nota || "")) await save(t.id, { nota: ta.value }); state.editing = null; render(); };
    body.append(ta);
  } else if (t.nota) body.append(el("p", "note-text", t.nota));
  row.append(cb, body);
  return row;
}

function render() {
  renderFilters(); renderSummary();
  const list = $("list"); list.replaceChildren();
  if (!state.tareas.length) { list.append(el("p", "empty", "Sin tareas todavía. Se cargan por día con cada grabación.")); return; }
  const visible = state.tareas.filter(t =>
    (state.setter === "Todos" || t.setter === state.setter) &&
    (state.estado === "todas" || (state.estado === "pend" ? !t.done : t.done)));
  if (!visible.length) { list.append(el("p", "empty", state.estado === "pend" ? "Nada pendiente." : "Nada por acá.")); return; }
  const byDay = {};
  visible.forEach(t => (byDay[t.fecha] ||= []).push(t));
  Object.keys(byDay).sort().reverse().forEach(fecha => {
    const tasks = byDay[fecha].sort((a, b) => (a.done - b.done) || (PRIO[a.prioridad] - PRIO[b.prioridad]) || ((a.orden || 0) - (b.orden || 0)));
    const dayAll = state.tareas.filter(t => t.fecha === fecha);
    const info = state.dias[fecha] || {};
    const sec = el("section", "day");
    const head = el("div", "day-head");
    const left = el("div");
    left.append(el("span", "date", fmtFecha(fecha)), el("h2", null, info.titulo || "Tareas del día"));
    head.append(left, el("span", "day-meta", dayAll.filter(t => t.done).length + "/" + dayAll.length));
    sec.append(head);
    if (info.resumen) sec.append(el("p", "day-note", info.resumen));
    if (Array.isArray(info.grabaciones) && info.grabaciones.length) {
      const src = el("div", "sources");
      info.grabaciones.forEach(g => {
        if (g.url && /^https:\/\//.test(g.url)) { const a = el("a", null, g.nombre + " ↗"); a.href = g.url; a.target = "_blank"; a.rel = "noopener"; src.append(a); }
        else src.append(el("span", null, g.nombre));
      });
      sec.append(src);
    }
    tasks.forEach(t => sec.append(taskRow(t)));
    list.append(sec);
  });
}

function showError(e) {
  const s = $("status"); s.hidden = false; s.className = "status err";
  if (e && e.code === "invalid_argument") { s.textContent = "Solo lectura: no tenés permiso para editar."; canWrite = false; $("add-box").hidden = true; render(); }
  else s.textContent = "No se pudo guardar. Revisá la conexión y probá de nuevo.";
}

function setupForm() {
  const sel = $("a-setter");
  SETTERS.forEach(s => sel.append(new Option(s, s)));
  $("a-fecha").value = hoy();
  $("add-toggle").onclick = () => { const f = $("add-form"); f.hidden = !f.hidden; $("add-toggle").setAttribute("aria-expanded", !f.hidden); if (!f.hidden) $("a-titulo").focus(); };
  $("add-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!db) return;
    const data = {
      fecha: $("a-fecha").value, setter: sel.value, prioridad: $("a-prio").value, plazo: $("a-plazo").value,
      titulo: $("a-titulo").value.trim(), detalle: $("a-detalle").value.trim(), done: false, nota: "", orden: 999, origen: "manual",
    };
    if (!data.titulo) return;
    try { await db.collection("tareas").add(data); $("a-titulo").value = ""; $("a-detalle").value = ""; }
    catch (e) { showError(e); }
  });
}

async function start() {
  setupForm(); render();
  db = await window.claude?.use?.("db");
  const status = $("status");
  if (!db) { status.textContent = "El registro no está disponible en esta vista. Abrí la página desde claude.ai."; status.className = "status err"; $("add-box").hidden = true; return; }
  const user = await window.claude.use("user");
  const can = user ? await user.can("data.write") : null;
  if (can === false) { canWrite = false; $("add-box").hidden = true; }
  let loaded = 0;
  const ready = () => { if (++loaded >= 2) status.hidden = true; };
  db.collection("tareas").onSnapshot(snap => {
    state.tareas = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.titulo && t.fecha);
    ready(); if (!state.editing) render();
  }, showError);
  db.collection("dias").onSnapshot(snap => {
    state.dias = {}; snap.docs.forEach(d => { const v = d.data(); state.dias[v.fecha || d.id] = v; });
    ready(); if (!state.editing) render();
  }, showError);
}
start();
</script>
